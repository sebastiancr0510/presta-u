<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{general/fragmentos :: head}"/>

<body>

<header th:replace="~{general/fragmentos :: header}"/>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="fw-bold m-0" th:text="#{inventario.titulo}">Inventario de equipos</h2>
        <a class="btn btn-prestau" th:href="@{/inventario/nuevo}" th:text="#{inventario.nuevo}">Nuevo equipo</a>
    </div>

    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div th:if="${equipos.isEmpty()}" class="alert alert-info" th:text="#{inventario.vacio}">
        No hay equipos registrados.
    </div>

    <div class="table-responsive" th:unless="${equipos.isEmpty()}">
        <table class="table table-dark table-striped table-hover align-middle">
            <thead>
                <tr>
                    <th th:text="#{equipo.codigo}">Código</th>
                    <th th:text="#{form.nombre}">Nombre</th>
                    <th th:text="#{equipo.categoria}">Categoría</th>
                    <th th:text="#{equipo.estado}">Estado</th>
                    <th th:text="#{inventario.activo}">Activo</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="e : ${equipos}">
                    <td th:text="${e.codigo}">LAP-014</td>
                    <td th:text="${e.nombre}">Laptop</td>
                    <td th:text="${e.categoria.nombre}">Computación</td>
                    <td th:text="${e.estadoOperativo == 'En servicio'} ? #{estado.servicio} : #{estado.mantenimiento}">
                        En servicio
                    </td>
                    <td th:text="${e.activo} ? #{inventario.si} : #{inventario.no}">Sí</td>

                    <td class="text-nowrap">
                        <a th:if="${e.activo}" class="btn btn-sm btn-warning"
                           th:href="@{/inventario/editar/{id}(id=${e.idEquipo})}"
                           th:text="#{inventario.editar}">Editar</a>
                        <a th:if="${e.activo}" class="btn btn-sm btn-outline-light"
                           th:href="@{/inventario/estado/{id}(id=${e.idEquipo})}"
                           th:text="#{inventario.estadoBtn}">Estado</a>
                        <button th:if="${e.activo}" type="button" class="btn btn-sm btn-danger"
                                data-bs-toggle="modal" data-bs-target="#modalInactivar"
                                th:attr="data-id=${e.idEquipo}, data-nombre=${e.nombre}"
                                th:text="#{inventario.inactivar}">Inactivar</button>
                        <form th:unless="${e.activo}" th:action="@{/inventario/activar}" method="post"
                              class="d-inline">
                            <input type="hidden" name="idEquipo" th:value="${e.idEquipo}"/>
                            <button type="submit" class="btn btn-sm btn-success"
                                    th:text="#{inventario.activar}">Activar</button>
                        </form>
                    </td>
                    
                </tr>
            </tbody>
        </table>
    </div>
</main>

<div th:replace="~{general/fragmentos :: confirmarInactivar}"></div>

<footer th:replace="~{general/fragmentos :: footer}"/>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        var modal = document.getElementById('modalInactivar');
        modal.addEventListener('show.bs.modal', function (event) {
            var boton = event.relatedTarget;
            document.getElementById('idInactivar').value = boton.dataset.id;
            document.getElementById('nombreInactivar').textContent = boton.dataset.nombre;
        });
    });
</script>

</body>
</html>
