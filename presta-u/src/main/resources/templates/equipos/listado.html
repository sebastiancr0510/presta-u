<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{general/fragmentos :: head}"/>

<body>

<header th:replace="~{general/fragmentos :: header}"/>

<main class="container py-4">
    <h2 class="fw-bold mb-3" th:text="#{equipos.titulo}">Catálogo de equipos</h2>

    <form method="get" th:action="@{/equipos}" class="row g-2 mb-4">
        <div class="col-md-5">
            <input type="text" name="texto" class="form-control"
                   th:placeholder="#{equipos.buscar}" th:value="${texto}"/>
        </div>
        <div class="col-md-4">
            <select name="categoriaId" class="form-select">
                <option value="" th:text="#{equipos.todas}">Todas las categorías</option>
                <option th:each="c : ${categorias}" th:value="${c.idCategoria}" th:text="${c.nombre}"
                        th:selected="${categoriaId != null and categoriaId.equals(c.idCategoria)}"></option>
            </select>
        </div>
        <div class="col-md-3 d-flex gap-2">
            <button class="btn btn-prestau w-100" type="submit" th:text="#{equipos.filtrar}">Buscar</button>
            <a class="btn btn-outline-light" th:href="@{/equipos}" th:text="#{equipos.limpiar}">Limpiar</a>
        </div>
    </form>

    <div th:if="${equipos.isEmpty()}" class="alert alert-info" th:text="#{equipos.vacio}">
        No hay equipos que coincidan con la búsqueda.
    </div>

    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col" th:each="e : ${equipos}">
            <div class="card card-prestau h-100">
                <div class="card-body">
                    <div th:if="${e.rutaImagen == null}" class="imagen-placeholder mb-3"
                         th:text="#{form.sinImagen}">Sin imagen</div>
                    <img th:unless="${e.rutaImagen == null}" th:src="${e.rutaImagen}"
                         class="imagen-equipo mb-3" th:alt="${e.nombre}"/>

                    <p class="texto-suave small mb-1"
                       th:text="${e.categoria.nombre} + ' · ' + ${e.codigo}">Computación · LAP-014</p>
                    <h5 class="fw-bold" th:text="${e.nombre}">Laptop</h5>
                    <span class="badge"
                          th:classappend="${e.estadoOperativo == 'En servicio'} ? 'badge-servicio' : 'badge-mantenimiento'"
                          th:text="${e.estadoOperativo == 'En servicio'} ? #{estado.servicio} : #{estado.mantenimiento}">
                        En servicio
                    </span>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{general/fragmentos :: footer}"/>

</body>
</html>
