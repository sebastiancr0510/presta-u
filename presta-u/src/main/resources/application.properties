spring.application.name=presta-u
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/presta_u}
spring.datasource.username=${DB_USERNAME:usuario_presta}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

spring.messages.basename=messages
spring.messages.encoding=UTF-8
# Archivo local opcional, excluido de Git.
spring.config.import=optional:file:./application-local.properties
prestau.usuario-demo-id=${DEMO_USER_ID:1}
