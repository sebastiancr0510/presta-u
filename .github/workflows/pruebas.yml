name: Pruebas Java 21 y MySQL
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: prueba_ci
          MYSQL_DATABASE: presta_u_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pprueba_ci"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: presta-u/pom.xml
      - name: Pruebas sobre MySQL temporal
        working-directory: presta-u
        run: >-
          mvn -B test
          -Dspring.datasource.url='jdbc:mysql://127.0.0.1:3306/presta_u_test?allowPublicKeyRetrieval=true&useSSL=false'
          -Dspring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
          -Dspring.datasource.username=root
          -Dspring.datasource.password=prueba_ci
      - name: Verificar scripts de instalación en base vacía
        env:
          MYSQL_PWD: prueba_ci
        run: |
          mysql -h 127.0.0.1 -u root < database/01-base.sql
          mysql -h 127.0.0.1 -u root < database/02-solicitudes.sql
          mysql -h 127.0.0.1 -u root < presta-u/src/main/resources/data-solicitudes.sql
          mysql -h 127.0.0.1 -u root presta_u -e 'SELECT estado,COUNT(*) FROM solicitud GROUP BY estado; SELECT COUNT(*) AS prestamos FROM prestamo;'
